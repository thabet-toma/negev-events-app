services:
  mysql:
    image: mysql:8.0
    container_name: negev_events_mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-negev_events}
      MYSQL_USER: ${DB_USER:-negev}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - negev_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Not published to the host by default — only the app container reaches it.
    expose:
      - "3306"
    networks:
      - negev_net

  app:
    build: ./server
    container_name: negev_events_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-negev_events}
      DB_USER: ${DB_USER:-negev}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_PHONE: ${ADMIN_PHONE:-0500000000}
      ADMIN_PIN: ${ADMIN_PIN:?set ADMIN_PIN in .env}
      ADMIN_NAME: ${ADMIN_NAME:-مدير عام المنصة}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      APP_LATEST_VERSION: ${APP_LATEST_VERSION:-}
      APP_MIN_VERSION: ${APP_MIN_VERSION:-}
      APP_APK_URL: ${APP_APK_URL:-}
      APP_RELEASE_NOTES: ${APP_RELEASE_NOTES:-}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-30}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - negev_uploads:/app/uploads
      # ملفات التوزيع من القرص لا من الصورة: تحديث APK لا يتطلب إعادة بناء.
      - ./server/downloads:/app/downloads
    networks:
      - negev_net

  # The web UI is a separate deployment that only talks to `app` over HTTP.
  # Swap it for a CDN/static host in production; nothing here couples it to the API.
  web:
    image: nginx:alpine
    container_name: negev_events_web
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-8080}:80"
    networks:
      - negev_net

volumes:
  negev_mysql_data:
  negev_uploads:

networks:
  negev_net:
    driver: bridge
